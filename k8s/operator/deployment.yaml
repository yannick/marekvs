apiVersion: apps/v1
kind: Deployment
metadata:
  name: marekvs-operator
  labels:
    app: marekvs-operator
spec:
  # Leader-elected via a coordination.k8s.io Lease, so >1 is safe;
  # 1 is still the sensible default (failover is a pod restart).
  replicas: 1
  selector:
    matchLabels:
      app: marekvs-operator
  template:
    metadata:
      labels:
        app: marekvs-operator
    spec:
      serviceAccountName: marekvs-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: operator
          # same image as the server — it carries both binaries
          image: ghcr.io/yannick/marekvs:latest
          command: ["/marekvs-operator"]
          env:
            - name: RUST_LOG
              value: info,kube=warn
            # Leader election: the Lease lives in this namespace and the pod
            # name is the holder identity, so two replicas never collide.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
