# Build and push the marekvs images to ghcr.io.
#
# Two images from the same build stage (identical binary):
#   ghcr.io/<owner>/marekvs:latest|sha-<sha>|vX.Y.Z      (Dockerfile, FROM scratch)
#   ghcr.io/<owner>/marekvs:debug|debug-sha-<sha>|...    (Dockerfile.debug, alpine
#                                                         + iptables/tc — chaos only)
#
# Multi-arch WITHOUT QEMU: the Rust musl build takes far too long emulated,
# so each platform builds on a native runner (ubuntu-24.04 / ubuntu-24.04-arm,
# free for public repos), pushes by digest, and a merge job stitches the
# manifest lists.
#
# Build context: the Dockerfiles COPY both `marekvs/` and `ondadb/` (path
# dependency), so the job checks out BOTH repos side by side and writes the
# same cargo [patch] the Justfile's _stage-ctx generates locally.

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ondadb-ref:
        description: ondadb ref to build against
        default: main

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout marekvs
        uses: actions/checkout@v4
        with:
          path: marekvs

      - name: checkout ondadb (path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ondadb
          ref: ${{ inputs.ondadb-ref || 'main' }}
          path: ondadb

      - name: point cargo at the checked-out ondadb
        run: |
          mkdir -p marekvs/.cargo
          printf '[patch."https://github.com/%s/ondadb.git"]\nondadb = { path = "../ondadb" }\n' \
            "${{ github.repository_owner }}" > marekvs/.cargo/config.toml

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: sanitize platform for artifact names
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: build+push production image (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: marekvs/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max

      - name: build+push debug image (by digest)
        id: build-debug
        uses: docker/build-push-action@v6
        with:
          context: .
          file: marekvs/Dockerfile.debug
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # same scope: the build stage is byte-identical to the production
          # image's, so the second build is a cache hit + alpine layer
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}

      - name: export digests
        run: |
          mkdir -p /tmp/digests/prod /tmp/digests/debug
          touch "/tmp/digests/prod/$(echo '${{ steps.build.outputs.digest }}' | cut -d: -f2)"
          touch "/tmp/digests/debug/$(echo '${{ steps.build-debug.outputs.digest }}' | cut -d: -f2)"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      # contents: write so a tag build can publish its GitHub Release.
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: production tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            # v-PREFIXED on purpose: metadata-action strips the `v` from the
            # git tag by default, which published v0.3.0 as `0.3.0`. The image
            # tag must read the same as the git tag and the release.
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            # Flux image-automation tag: <branch>-<sha7>-<unix ts>, sortable
            # by the trailing timestamp (same convention as console-mono).
            type=raw,value={{branch}}-{{sha}}-{{date 'X'}},enable={{is_default_branch}}

      - name: debug tags
        id: meta-debug
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=debug,enable={{is_default_branch}}
            type=sha,prefix=debug-sha-
            type=semver,pattern=v{{version}},prefix=debug-
            type=semver,pattern=v{{major}}.{{minor}},prefix=debug-
            type=raw,value=debug-{{branch}}-{{sha}}-{{date 'X'}},enable={{is_default_branch}}

      - name: create production manifest list
        working-directory: /tmp/digests/prod
        run: |
          # shellcheck disable=SC2046  # word splitting is the point here
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: create debug manifest list
        working-directory: /tmp/digests/debug
        run: |
          # shellcheck disable=SC2046  # word splitting is the point here
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-debug.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: inspect
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:$(jq -r '.tags[0]' <<< '${{ steps.meta.outputs.json }}' | cut -d: -f2)"

      # ---- GitHub Release (tag builds only) --------------------------------
      # Runs AFTER the manifest lists exist and the inspect passed, so a
      # release is never published pointing at images that failed to build.
      # The notes come from the annotated tag, which is where they are written
      # (`git tag -a`) — keeping one source of truth rather than retyping them.
      - name: publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh release` resolves the repo from git remotes, and this job has
          # no checkout — without GH_REPO it dies with
          # "failed to run git: fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Read the annotated tag's message over the API — this job has no
          # checkout (it only merges manifest lists), and cloning just to read
          # one tag body would be wasteful.
          SHA=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')
          # Annotated tag → tag object carries the message; lightweight tag →
          # fall back to the commit message.
          MSG=$(gh api "repos/$GH_REPO/git/tags/$SHA" --jq '.message' 2>/dev/null \
                || gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message')
          TITLE=$(head -1 <<< "$MSG")
          tail -n +2 <<< "$MSG" > /tmp/notes.md
          {
            echo
            echo '## Images'
            echo
            echo '```'
            jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}'
            jq -r '.tags[]' <<< '${{ steps.meta-debug.outputs.json }}'
            echo '```'
          } >> /tmp/notes.md
          # Idempotent: re-running a tag build updates the release in place
          # instead of failing on "already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file /tmp/notes.md \
              $(case "$TAG" in *-*) echo --prerelease;; esac)
          fi
